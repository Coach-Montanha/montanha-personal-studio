<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051f15" />
      <stop offset="50%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#020608" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="4" />
  <circle cx="256" cy="256" r="200" fill="url(#emeraldAura)" />

  <g filter="url(#glow)">
    <!-- Dumbbell / Financial Growth Shield Base -->
    <path d="M 160 320 L 256 140 L 352 320 L 300 320 L 256 240 L 212 320 Z" fill="url(#emeraldGrad)" />
    <!-- Monogram PS -->
    <text x="256" y="295" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="110" letter-spacing="4">PS</text>
  </g>

  <!-- Title Badge -->
  <text x="256" y="415" text-anchor="middle" fill="url(#emeraldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="6">MONTANHA</text>
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="4">PERSONAL STUDIO</text>
</svg>
