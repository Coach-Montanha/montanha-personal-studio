<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Montanha Personal Studio</title>
  <meta name="description" content="Gestão Financeira &amp; Inteligência Operacional para Studios e Personais." />
  <meta name="theme-color" content="#6958E2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Montanha Personal Studio" />
  <meta name="mobile-web-app-capable" content="yes" />
  <noscript>
    <meta http-equiv="refresh" content="5;url=https://montanha-personal-studio.vercel.app" />
  </noscript>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root {
      --bg: #F8F9FE;
      --card-bg: #ffffff;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --primary: #6958E2;
      --primary-hover: #5B4BC4;
      --spinner-track: rgba(105, 88, 226, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #050A14;
        --card-bg: #0B1329;
        --text-main: #F8FAFC;
        --text-muted: #94A3B8;
        --spinner-track: rgba(105, 88, 226, 0.25);
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top, 0px))
               max(20px, env(safe-area-inset-right, 0px))
               max(24px, env(safe-area-inset-bottom, 0px))
               max(20px, env(safe-area-inset-left, 0px));
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .container {
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .logo-wrapper {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #6958E2 0%, #8B5CF6 100%);
      padding: 2px;
      box-shadow: 0 10px 25px -5px rgba(105, 88, 226, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      object-fit: cover;
      display: block;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      font-weight: 500;
      margin-top: 4px;
    }
    .loader-container {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-height: 80px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid var(--spinner-track);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      max-width: 280px;
      line-height: 1.4;
    }
    .retry-btn {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 160px;
      padding: 10px 24px;
      border-radius: 12px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(105, 88, 226, 0.35);
      touch-action: manipulation;
      transition: background-color 0.15s ease;
    }
    .retry-btn:hover, .retry-btn:active {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <img class="logo-img" src="./icon-192.png" alt="Montanha Personal Studio" width="88" height="88" onerror="this.style.display='none'" />
    </div>
    <div>
      <h1 class="brand-title">Montanha Personal Studio</h1>
      <p class="brand-subtitle">Gestão Financeira &amp; Inteligência Operacional</p>
    </div>
    <div class="loader-container">
      <div id="spinner" class="spinner" aria-label="Carregando"></div>
      <p id="status" class="status-text">Conectando ao estúdio...</p>
      <button id="retry-btn" class="retry-btn" type="button" onclick="handleRetry()">Tentar novamente</button>
    </div>
  </div>

  <script>
    (function() {
      const PROD_URL = "https://montanha-personal-studio.vercel.app";
      const statusEl = document.getElementById("status");
      const spinnerEl = document.getElementById("spinner");
      const retryBtn = document.getElementById("retry-btn");

      function updateUI(isOnline) {
        if (!isOnline) {
          if (spinnerEl) spinnerEl.style.display = "none";
          if (retryBtn) retryBtn.style.display = "inline-flex";
          if (statusEl) statusEl.textContent = "Sem conexão com a internet. Verifique sua rede e tente novamente.";
        } else {
          if (spinnerEl) spinnerEl.style.display = "block";
          if (retryBtn) retryBtn.style.display = "none";
          if (statusEl) statusEl.textContent = "Conectando ao estúdio...";
        }
      }

      function navigate() {
        if (!navigator.onLine) {
          updateUI(false);
          return;
        }
        updateUI(true);
        try {
          const targetHost = new URL(PROD_URL).hostname;
          if (window.location.hostname === targetHost) {
            return;
          }
          const path = (window.location.pathname === "/" || window.location.pathname === "/index.html") ? "" : window.location.pathname;
          const target = PROD_URL + path + window.location.search + window.location.hash;
          window.location.replace(target);
        } catch (e) {
          window.location.replace(PROD_URL);
        }
      }

      window.handleRetry = function() {
        navigate();
      };

      window.addEventListener("online", function() {
        navigate();
      });

      window.addEventListener("offline", function() {
        updateUI(false);
      });

      if (!navigator.onLine) {
        updateUI(false);
      } else {
        navigate();
      }
    })();
  </script>
</body>
</html>
